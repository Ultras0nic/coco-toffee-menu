name: Verify menu data

# Read-only checks for proposed code changes. Cloudflare Pages performs the
# production build from main; GitHub does not publish the website.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify menu data
        run: npm test
      - name: Build public site
        run: npm run build
